openapi: 3.1.0

info:
  title: Linewarmer — System Design Interview Platform API
  version: 1.0.0
  summary: The backend contract expected by the frontend in `frontend/`.
  description: |
    This document is derived from the frontend's API client, not from an existing
    backend. It is the contract a real backend must satisfy for the SPA to work
    against it unchanged.

    Source of truth in the frontend:

    - `frontend/src/services/api.ts` — the `InterviewApi` interface; every network
      call in the app goes through it.
    - `frontend/src/services/types.ts` — every wire type used below.
    - `frontend/src/services/mock/mockApi.ts` — the in-memory implementation the app
      currently runs against. Its behaviour (filtering, ordering, error text,
      side effects) defines the semantics documented here.
    - `frontend/src/services/index.ts` — swaps the mock for a real implementation.

    ## Transport split

    Everything except the room connection is HTTP/JSON under `/v1`. The live room
    (`InterviewApi.connect`) is a WebSocket; it is described at
    `GET /v1/sessions/{sessionId}/realtime` and in the `x-websocket-protocol`
    section at the bottom of this file. All canvas mutations during a session flow
    over the socket — there is no REST endpoint for posting canvas operations.

    ## Authentication model

    The client never handles a token: `signIn` takes only an email, `getCurrentUser`
    takes no argument, and no call site attaches an `Authorization` header. The
    backend must therefore use `HttpOnly` cookies.

    Two credentials:

    - `lw_session` — issued by `POST /v1/auth/sign-in`, identifies an authenticated
      interviewer across all their sessions.
    - `lw_guest` — issued by `POST /v1/join/{token}`, scoped to exactly one
      `(sessionId, participantId)` pair. A guest holding this cookie must not be
      able to read or mutate any other session.

    Both must be `HttpOnly`, `Secure`, `SameSite=Lax`, and set on a path covering
    `/v1`. Requests are made with `credentials: "include"` semantics.

    Each operation below states which credential it requires under **Auth**.

    ## Error contract

    The client surfaces `Error.message` directly to the user (`useRoom` shows it in
    a transient banner; the room bootstrap renders it on a blocking screen). Message
    text is therefore user-facing copy, not developer detail: it must be complete,
    plain-language sentences, and must not leak whether a session ID exists to a
    caller not entitled to know.

    Every non-2xx response uses the `Error` schema. `code` is the stable identifier
    for logging and client branching; `message` is the display string.

  contact:
    name: Linewarmer engineering
  license:
    name: UNLICENSED

servers:
  - url: https://api.linewarmer.example/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local development (backend runs under `uv`, per AGENTS.md)

tags:
  - name: auth
    description: Interviewer sign-in and identity.
  - name: sessions
    description: Interview session lifecycle and dashboard.
  - name: guest-links
    description: Revocable bearer links that let a guest join a session.
  - name: participants
    description: Joining a room and managing who is in it.
  - name: canvas
    description: Canvas snapshot reads and owner-level canvas control.
  - name: realtime
    description: WebSocket room connection (operations and presence).

security:
  - sessionCookie: []

paths:
  # ------------------------------------------------------------------ auth ---

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Read the signed-in interviewer
      description: |
        Backs `InterviewApi.getCurrentUser(): Promise<User | null>`.

        **Auth:** `lw_session` optional. This is the only endpoint where a missing
        or invalid credential is an expected, non-exceptional outcome: the client
        maps `401` to `null` rather than throwing, so an anonymous visitor can be
        detected without an error path. Return `401` — not `200` with a null body —
        so the distinction stays in the status line.

        A guest holding only `lw_guest` is not a `User` and must receive `401`.
      security:
        - sessionCookie: []
        - {}
      responses:
        "200":
          description: An interviewer is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Nobody is signed in. The client reads this as `null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Not authenticated

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in an interviewer by email
      description: |
        Backs `InterviewApi.signIn(email): Promise<User>`.

        The mock resolves straight to a `User`, creating one on first sight of an
        email and deriving `displayName` from the local part. The client has no
        callback route and no code-entry screen, so this endpoint must complete the
        sign-in in one round trip and set `lw_session` on the response.

        > **Divergence from `_docs/spec.md` §6.1**, which requires magic-link or IdP
        > authentication. A magic link needs a second round trip and a landing
        > route, neither of which exists in the client. Either keep this endpoint as
        > a development-only shortcut behind a flag, or add a
        > `POST /v1/auth/magic-link` + verification route and change `signIn`'s
        > return type to `void`. Shipping this endpoint as-is to production would
        > let anyone sign in as anyone by typing their email.

        **Auth:** none. Rate-limit per IP and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
            example:
              email: jordan@linewarmer.io
      responses:
        "200":
          description: |
            Signed in. Sets the `lw_session` cookie. Returns the existing user for a
            known email, or a newly created one otherwise.
          headers:
            Set-Cookie:
              description: "`lw_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out
      description: |
        Backs `InterviewApi.signOut(): Promise<void>`. Clears `lw_session`
        server-side and expires the cookie. Must be idempotent — signing out when
        already signed out returns `204`, not `401`.

        **Auth:** `lw_session` optional.
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: Signed out. Expires the `lw_session` cookie.
          headers:
            Set-Cookie:
              description: "`lw_session=; Max-Age=0`"
              schema:
                type: string

  # -------------------------------------------------------------- sessions ---

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List the dashboard's sessions
      description: |
        Backs `InterviewApi.listSessions(): Promise<InterviewSession[]>`, rendered by
        `frontend/src/routes/index.tsx`.

        Server-side filtering and ordering the client depends on and does not redo:

        - Only sessions owned by the caller.
        - `state: "archived"` excluded. Archiving is how a session leaves the
          dashboard, so an archived session reappearing would look like a bug.
        - Sorted by `updatedAt` descending.

        `_docs/spec.md` §12 describes this as "list owned **or invited** sessions".
        The mock returns owned only; if you add invited sessions, the dashboard's
        owner-only actions (duplicate, archive, copy link) will start failing with
        `403` for rows the user does not own, so gate those in the UI at the same
        time.

        **Auth:** `lw_session` required.
      responses:
        "200":
          description: The caller's non-archived sessions, newest activity first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"

    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a draft session
      description: |
        Backs `InterviewApi.createSession(input)`, called from
        `frontend/src/routes/sessions.new.tsx`, which navigates straight to
        `/room/{id}` with the returned `id`.

        Server-side initialisation the client assumes:

        - `ownerUserId` = the caller. Never accept it from the body.
        - `state: "draft"`, `startedAt: null`, `endedAt: null`.
        - `candidateEditingEnabled: true`, `cursorsVisible: true`.
        - An empty canvas document with `cursor: 0`, so `GET .../canvas` works
          immediately.
        - `title` trimmed, falling back to `"Untitled interview"` when empty;
          `prompt` trimmed.

        **Auth:** `lw_session` required. Rate-limit per user (`_docs/spec.md` §13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: |
            Created. The client does not read `Location`; it uses the body's `id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"

    get:
      operationId: getSession
      tags: [sessions]
      summary: Read one session
      description: |
        Backs `InterviewApi.getSession(id)`. Called by `useRoom` on mount for every
        participant, so this is **not** owner-only — any current participant of the
        session must be able to read it, guests included.

        The response drives the room's permission UI: `state` and
        `candidateEditingEnabled` decide `canEdit`, and `prompt` is shown in the
        right-hand panel.

        > `_docs/spec.md` §6.2 allows gating the prompt until the interviewer starts
        > the session. The client has no separate prompt fetch, so if you adopt that
        > rule, return `prompt: ""` here for candidates until the gate opens and push
        > the real value in the `permission_changed` socket message. Do not add a
        > new endpoint — the client will not call it.

        **Auth:** `lw_session` (owner or invited interviewer) or `lw_guest` scoped to
        this `sessionId`. Anything else gets `404`, not `403`, so session IDs cannot
        be probed for existence.
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/SessionNotFound"

    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update session settings
      description: |
        Backs `InterviewApi.updateSession(id, patch)`. Used by the owner controls in
        `frontend/src/routes/room.$sessionId.tsx`: the "candidate can edit" and
        "show cursors" toggles fire this on every change.

        A partial update — apply only the keys present. Absent keys are unchanged;
        an explicit `null` for `scheduledAt` clears it.

        **Side effect the client depends on:** after committing, broadcast
        `permission_changed` with the updated session to every socket in the room.
        The toggling owner's own UI updates through that broadcast, not through this
        response — `useRoom` sets session state from the socket message, and the
        HTTP response is discarded at the call site. If you skip the broadcast, the
        toggle appears not to work.

        **Auth:** `lw_session`, owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: The updated session, with a bumped `updatedAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/start:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start the session
      description: |
        Backs `InterviewApi.startSession(id)`. Two call sites in the room screen: the
        "Start interview" button in the top bar and in the owner panel.

        Transition: `state` → `"live"`; `startedAt` set on first start only
        (re-starting a live session leaves the original `startedAt` intact — the
        top bar's elapsed timer reads it); `updatedAt` bumped. Emit a
        `session.started` audit event.

        **Side effect:** broadcast `permission_changed` to the room.

        Idempotent for a session already `"live"`. Reopening an `"ended"` session is
        listed as an open product question in `_docs/spec.md` §18.2; the mock allows
        it, so allow it or return `409` with copy the room screen can display.

        **Auth:** `lw_session`, owner only.
      responses:
        "200":
          description: The live session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/end:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: endSession
      tags: [sessions]
      summary: End the session
      description: |
        Backs `InterviewApi.endSession(id)`, behind a confirmation dialog in the room
        screen.

        Transition: `state` → `"ended"`; `candidateEditingEnabled` → `false`
        (forced, regardless of prior value); `endedAt` and `updatedAt` set to now.
        Emit a `session.ended` audit event and write a final canvas snapshot
        (`_docs/spec.md` §5.4).

        **Side effect:** broadcast `session_ended` — not `permission_changed` — to
        the room. `useRoom` handles both by replacing the session, but the room
        screen distinguishes them for its read-only banner.

        After this, the server must reject canvas operations from every role; see
        the `editing_locked` rule in `x-websocket-protocol`.

        **Auth:** `lw_session`, owner only. Per `_docs/spec.md` §9, an additional
        interviewer cannot end a session.
      responses:
        "200":
          description: The ended session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: archiveSession
      tags: [sessions]
      summary: Archive the session
      description: |
        Backs `InterviewApi.archiveSession(id)`, the dashboard's row action. The
        dashboard optimistically removes the row, so the session must not come back
        from a later `GET /v1/sessions`.

        Transition: `state` → `"archived"`; `updatedAt` bumped. Emit a
        `session.archived` audit event. Archiving is not deletion — canvas and
        operation history are retained, and `GET /v1/sessions/{id}` still resolves
        for the owner.

        New guest joins against an archived session are rejected; see
        `POST /v1/join/{token}`.

        **Auth:** `lw_session`, owner only.
      responses:
        "200":
          description: The archived session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: duplicateSession
      tags: [sessions]
      summary: Duplicate a session as a new draft
      description: |
        Backs `InterviewApi.duplicateSession(id)`, the "Duplicate" row action; the
        dashboard navigates to the copy's room on success.

        The copy is a fresh draft owned by the caller:

        - `title` = `"<source title> (copy)"`, `prompt` copied verbatim.
        - `state: "draft"`, `scheduledAt`/`startedAt`/`endedAt` all `null`.
        - Canvas elements deep-copied from the source; element IDs may be reused
          since the documents are separate, but the operation log is **not** copied
          and the new document starts at `cursor: 0`.
        - Guest links and participants are **not** copied. A duplicate must never
          inherit a live bearer token.

        **Auth:** `lw_session`, owner of the source session.
      responses:
        "201":
          description: The new draft session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  # ----------------------------------------------------------- guest links ---

  /sessions/{sessionId}/guest-links:
    parameters:
      - $ref: "#/components/parameters/SessionId"

    get:
      operationId: listGuestLinks
      tags: [guest-links]
      summary: List active guest links
      description: |
        Backs `InterviewApi.listGuestLinks(sessionId)`. Called by the dashboard's
        "Copy link" action and by the room screen on mount when the viewer is the
        owner.

        Returns only links where `revokedAt` is `null`. Both call sites then pick
        `links.find(l => !l.revokedAt)` and create a link if the list is empty, so
        returning revoked links would hand out a dead token.

        **Token exposure:** this response contains the plaintext bearer token, which
        is what the copy-link button puts on the clipboard. `_docs/spec.md` §11
        requires storing only `token_hash`, so the plaintext cannot be re-derived
        after creation. Reconcile one of two ways — either keep the plaintext
        encrypted at rest so the owner can re-copy it, or return `token: null` here
        and treat `POST` (rotation) as the only way to obtain a copyable link. The
        second is safer but changes the UI: the copy button would rotate the link
        every time. `token` is typed non-nullable in
        `frontend/src/services/types.ts`, so option two needs a frontend change.

        Keep tokens out of access logs, analytics, and referrers regardless.

        **Auth:** `lw_session`, owner only.
      responses:
        "200":
          description: Active (non-revoked) links for the session.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

    post:
      operationId: createGuestLink
      tags: [guest-links]
      summary: Create or rotate a guest link
      description: |
        Backs `InterviewApi.createGuestLink(sessionId, role?)`, where `role` defaults
        to `"candidate"`.

        **This rotates, it does not accumulate.** Before issuing the new link, revoke
        every active link on the session that grants the same role by stamping
        `revokedAt`. Links granting the *other* role are untouched, so a session can
        hold one live candidate link and one live observer link at once. Emit a
        `link.rotated` audit event.

        The new link:

        - `token`: at least 128 bits of CSPRNG entropy, hex-encoded
          (`_docs/spec.md` §13). Store only its hash.
        - `roleGranted`: as requested.
        - `expiresAt: null`, `maxUses: 10`, `uses: 0`, `revokedAt: null`.

        `maxUses` is enforced at join time as a **concurrency cap**, not a lifetime
        counter — see `POST /v1/join/{token}`.

        The client builds the shareable URL itself as
        `${window.location.origin}/join/{token}`.

        **Auth:** `lw_session`, owner only.
      requestBody:
        required: false
        description: Omitted entirely by the client when the default role is wanted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  $ref: "#/components/schemas/GuestRole"
              example:
                role: candidate
      responses:
        "201":
          description: The new link. Any prior link for the same role is now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /sessions/{sessionId}/guest-links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: linkId
        in: path
        required: true
        description: "`GuestLink.id`."
        schema:
          type: string
          example: lnk_seed

    delete:
      operationId: revokeGuestLink
      tags: [guest-links]
      summary: Revoke a guest link
      description: |
        Backs `InterviewApi.revokeGuestLink(sessionId, linkId)`, the room screen's
        "Revoke all links" control, which loops over active links calling this once
        each.

        A soft delete: stamp `revokedAt`, keep the row. Emit a `link.revoked` audit
        event.

        **Revocation blocks new joins only.** Per `_docs/spec.md` §16.8, participants
        already in the room stay connected and keep editing; the owner removes them
        separately via `DELETE .../participants/{participantId}`. Do not close
        sockets here.

        The link must belong to `sessionId` — reject a well-formed `linkId` from
        another session with `404`.

        Idempotent: revoking an already-revoked link returns `204`.

        **Auth:** `lw_session`, owner only.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: No such link on this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: link_not_found
                message: Link not found

  # ---------------------------------------------------------- participants ---

  /sessions/{sessionId}/participants:
    parameters:
      - $ref: "#/components/parameters/SessionId"

    get:
      operationId: listParticipants
      tags: [participants]
      summary: List active participants
      description: |
        Backs `InterviewApi.listParticipants(sessionId)`.

        Returns only participants with `leftAt === null`. The room screen uses this
        on mount to resume a remembered participant: it reads
        `{sessionId, participantId}` from `sessionStorage`
        (`frontend/src/features/room/participantStore.ts`) and looks for a match in
        this list. A participant the owner removed disappears from the list, which is
        what forces the removed guest back through the join flow.

        Available to any current participant — the room screen calls it before it
        knows the viewer's role. It returns display names and roles of everyone in
        the room, which participants see in the presence bar anyway.

        **Auth:** `lw_session` (owner or invited interviewer) or `lw_guest` scoped to
        this `sessionId`.
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        "200":
          description: Participants currently in the session.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/join:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: joinAsOwner
      tags: [participants]
      summary: Join a session as an authenticated user
      description: |
        Backs `InterviewApi.joinAsOwner(sessionId)`. The room screen calls it when no
        remembered participant matches, and stores the returned `participant.id` in
        `sessionStorage` for the reconnect path.

        Despite the client-side name, it covers both authenticated roles. The mock
        assigns `role: "owner"` when `session.ownerUserId` is the caller and
        `role: "interviewer"` otherwise.

        Idempotent per user: if the caller already has a participant row on this
        session with `leftAt === null`, return that row rather than creating a
        second one. Otherwise create one with `userId` set, `displayName` from the
        user profile, and a `color` assigned round-robin from the session's palette.

        > **Authorization decision required.** The mock grants `"interviewer"` to any
        > authenticated user for any session ID, which fails acceptance criterion
        > `_docs/spec.md` §16.10 — an authenticated candidate could walk another
        > company's session IDs. The real backend must require an existing
        > `SessionMembership` (§11) for a non-owner and return `404` otherwise. The
        > client needs no change: it already renders `joinError` on a blocking
        > screen with the message from this response.

        **Auth:** `lw_session` required. A `lw_guest` cookie is not sufficient —
        guests enter through `POST /v1/join/{token}`.
      responses:
        "200":
          description: |
            The session and the caller's participant record, existing or newly
            created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            Authenticated but not a member of this session. Prefer `404` unless the
            caller is entitled to know the session exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: forbidden
                message: You do not have access to this interview.
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/participants/{participantId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: participantId
        in: path
        required: true
        description: "`Participant.id`."
        schema:
          type: string
          example: pt_owner

    delete:
      operationId: removeParticipant
      tags: [participants]
      summary: Remove a participant from the session
      description: |
        Backs `InterviewApi.removeParticipant(sessionId, participantId)`.

        A soft delete: stamp `leftAt`, keep the row for the audit trail. Emit a
        `participant.removed` audit event.

        **Side effects, in order:**

        1. Drop the participant from room presence.
        2. Close their WebSocket, or reject everything on it from this point.
        3. Broadcast `presence_update` with the remaining presence list to the room.

        Without step 2 the removed guest keeps editing, because `useRoom` only stops
        sending when the socket closes or the server rejects.

        **Auth:** `lw_session`, owner only. Per `_docs/spec.md` §9, an additional
        interviewer cannot remove participants.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: No such participant on this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: participant_not_found
                message: Participant not found

  /join/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: |
          The plaintext bearer token from `GuestLink.token`. Hash it and look up by
          hash; never log or echo it. Compare in constant time.
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{16,128}$"
          example: demo-candidate-token

    post:
      operationId: joinWithToken
      tags: [participants]
      summary: Redeem a guest link and join as a guest
      description: |
        Backs `InterviewApi.joinWithToken(token, displayName)` — the candidate lobby
        flow from `_docs/spec.md` §5.2.

        > **Not yet wired up in the frontend.** There is no `/join/$token` route
        > under `frontend/src/routes/` today; the method exists on the client
        > interface and the room screen already handles the resulting participant,
        > but the lobby screen is unbuilt. Build this endpoint to the contract below
        > — the client will consume it unchanged once the route lands.

        Validation, in the order the mock checks it, because each step has distinct
        user-facing copy:

        1. Token unknown → `404` `link_invalid`.
        2. `revokedAt` set → `410` `link_revoked`.
        3. `expiresAt` in the past → `410` `link_expired`.
        4. Session `archived` → `410` `session_archived`.
        5. Session `ended` → `410` `session_ended`.
        6. Active participants ≥ `maxUses` → `409` `session_full`.
        7. Trimmed `displayName` shorter than 2 characters → `400`
           `invalid_display_name`.

        Note step 6: `maxUses` is compared against the count of participants with
        `leftAt === null`, so it caps **concurrency**, not lifetime redemptions.
        A candidate who leaves and rejoins does not exhaust the link. `uses` is
        still incremented on every redemption, for reporting.

        On success: increment `uses`, create a `Participant` with `userId: null`,
        `role` = the link's `roleGranted`, the trimmed name truncated to 40
        characters, and a round-robin `color`. Emit a `participant.joined` audit
        event. Set the `lw_guest` cookie scoped to this `(sessionId, participantId)`
        — per `_docs/spec.md` §13 the bearer link must not be re-transmitted after
        this exchange.

        **Auth:** none; the path token is the credential. Rate-limit per IP and per
        token — this is the platform's only unauthenticated write.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 40
                  description: |
                    Trimmed and truncated to 40 characters server-side. Sanitize
                    before any HTML rendering or export (`_docs/spec.md` §13).
            example:
              displayName: Alex Chen
      responses:
        "200":
          description: Joined. Sets the `lw_guest` cookie.
          headers:
            Set-Cookie:
              description: "`lw_guest=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "400":
          description: The display name is missing or too short after trimming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_display_name
                message: Please enter your name.
        "404":
          description: No link matches this token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: link_invalid
                message: This link is not valid.
        "409":
          description: The session is at its participant cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: session_full
                message: This interview is full.
        "410":
          description: |
            The link or the session is no longer joinable. `code` distinguishes the
            four cases; each has its own copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                revoked:
                  value:
                    code: link_revoked
                    message: This link has been revoked by the interviewer.
                expired:
                  value:
                    code: link_expired
                    message: This link has expired.
                archived:
                  value:
                    code: session_archived
                    message: This interview is no longer available.
                ended:
                  value:
                    code: session_ended
                    message: This interview has ended.
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- canvas ---

  /sessions/{sessionId}/canvas:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getCanvas
      tags: [canvas]
      summary: Read the current canvas snapshot
      description: |
        Backs `InterviewApi.getCanvas(sessionId)`.

        A REST fallback and support/export path. The live room does not use it —
        `useRoom` gets its first snapshot from the `room_joined` socket message and
        every subsequent change from `document_update`. Serve the same materialised
        state both ways or the two paths will disagree.

        `cursor` is the operation-log position the returned elements reflect. A
        client holding a snapshot at cursor *N* must be able to resume from
        operations with `cursor > N` without gaps — that is the contract that makes
        reconnect converge without a page reload (`_docs/spec.md` §6.7).

        **Auth:** `lw_session` (owner or invited interviewer) or `lw_guest` scoped to
        this `sessionId`.
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        "200":
          description: The current snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /sessions/{sessionId}/canvas/clear:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: clearCanvas
      tags: [canvas]
      summary: Clear the canvas
      description: |
        Backs `InterviewApi.clearCanvas(sessionId, actorId)`, behind a confirmation
        in the room screen's owner panel.

        Server-side this is a `{ "type": "clear" }` canvas operation, not a special
        case: append it to the operation log with the next `cursor`, empty the
        materialised element set, and fan it out to the room as a `document_update`
        so every client's `useRoom` reducer clears too. Skipping the broadcast leaves
        other participants showing stale elements.

        Per `_docs/spec.md` §6.9 the pre-clear snapshot must remain recoverable. The
        operation log gives you that for free — do not hard-delete element rows.

        **`actorId` in the body is advisory.** The client sends its own
        `participantId`, but the server must attribute the operation to the caller's
        authenticated participant and ignore a mismatched value rather than trusting
        it. It is accepted only because the client sends it.

        **Auth:** `lw_session`, owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId]
              properties:
                actorId:
                  type: string
                  description: |
                    The caller's `Participant.id`. Advisory — attribute to the
                    authenticated participant instead.
            example:
              actorId: pt_owner
      responses:
        "204":
          description: |
            Cleared. The resulting state reaches the client over the socket, not in
            this response.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  # -------------------------------------------------------------- realtime ---

  /sessions/{sessionId}/realtime:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: connectRoom
      tags: [realtime]
      summary: Open the room WebSocket
      description: |
        Backs `InterviewApi.connect(sessionId, participantId, onMessage, onStatus)`,
        which returns the `RoomHandle` (`sendOps`, `updatePresence`, `disconnect`,
        `simulateNetworkDrop`) used by `useRoom`.

        This is a WebSocket upgrade, described here only so the endpoint, its
        parameters, and its auth appear in the contract. The message schemas are in
        `x-websocket-protocol` at the bottom of this document; the payload types are
        `components/schemas/ClientMessage` and `components/schemas/ServerMessage`.

        **Authorization is per message, not per connection** (`_docs/spec.md` §12).
        Re-check membership and edit permission on every `document_update` — a
        participant removed, or an editing lock applied, mid-connection must start
        being rejected immediately.

        **Auth:** `lw_session` or `lw_guest`. The credential must resolve to the
        `participantId` in the query string and to this `sessionId`; a mismatch is a
        `forbidden` error message followed by a close, which is how the mock behaves
        for an unknown or departed participant.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: participantId
          in: query
          required: true
          description: |
            The caller's `Participant.id`, from `POST /v1/join/{token}` or
            `POST /v1/sessions/{id}/join`. Verify it against the cookie rather than
            trusting it.
          schema:
            type: string
            example: pt_owner
      responses:
        "101":
          description: Switching Protocols — the room socket is open.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The credential does not match `participantId`, or the participant has
            left. The mock's equivalent is an `error` message with code `forbidden`
            and status `offline`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: forbidden
                message: You are not a participant of this session.
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lw_session
      description: |
        `HttpOnly` session cookie for an authenticated interviewer, set by
        `POST /v1/auth/sign-in`. Identifies a `User`; the user's role in any given
        session is derived server-side from ownership or membership.
    guestCookie:
      type: apiKey
      in: cookie
      name: lw_guest
      description: |
        `HttpOnly` cookie for a guest participant, set by `POST /v1/join/{token}`.
        Scoped to exactly one `(sessionId, participantId)` pair and must not
        authorize any other session. Short-lived, per `_docs/spec.md` §13; expire it
        when the session ends.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: "`InterviewSession.id`."
      schema:
        type: string
        example: ses_ratelimiter

  responses:
    BadRequest:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_request
            message: That doesn't look right. Check the highlighted fields and try again.
    Unauthenticated:
      description: No valid credential was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Not authenticated
    OwnerOnly:
      description: |
        Authenticated, but not the session owner. The mock's message for this is
        `"Forbidden: owner only"`; replace it with user-facing copy, since the
        client displays `message` verbatim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden_owner_only
            message: Only the interview owner can do that.
    SessionNotFound:
      description: |
        No such session, or the caller is not entitled to know it exists. Return this
        rather than `403` for non-members so session IDs cannot be enumerated
        (`_docs/spec.md` §16.10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: session_not_found
            message: This interview isn't available.
    RateLimited:
      description: Too many requests (`_docs/spec.md` §13).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Too many attempts. Try again in a moment.

  schemas:
    # ------------------------------------------------------------- errors ---

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      description: |
        The shape of every non-2xx response, and of the `error` socket message.

        The client throws `new Error(message)` and renders it — `useRoom` in a
        4-second banner, the room bootstrap on a blocking screen. Write `message` as
        finished user-facing copy.
      properties:
        code:
          type: string
          description: |
            Stable machine identifier. Never localize or reword; the client and
            observability (`_docs/spec.md` §15) group on it.
          enum:
            - unauthenticated
            - forbidden
            - forbidden_owner_only
            - session_not_found
            - session_archived
            - session_ended
            - session_full
            - link_invalid
            - link_revoked
            - link_expired
            - link_not_found
            - participant_not_found
            - invalid_display_name
            - invalid_request
            - editing_locked
            - rate_limited
            - internal_error
        message:
          type: string
          description: User-facing text, displayed verbatim.
      example:
        code: session_not_found
        message: This interview isn't available.

    # --------------------------------------------------------------- core ---

    Role:
      type: string
      description: |
        A participant's role in one session. Capability matrix in
        `_docs/spec.md` §9.
      enum: [owner, interviewer, candidate, observer]

    GuestRole:
      type: string
      description: |
        The subset of roles a guest link may grant. Typed in the client as
        `Extract<Role, "candidate" | "observer">` — a link can never confer `owner`
        or `interviewer`.
      enum: [candidate, observer]

    SessionState:
      type: string
      description: |
        Lifecycle state (`_docs/spec.md` §6.1). `ended` and `archived` both make the
        canvas read-only for every role in the client's `canEdit` check.
      enum: [draft, live, ended, archived]

    ParticipantColor:
      type: string
      description: |
        A design-token name, **not** a CSS color. The client interpolates it as
        `var(--{color})` in `CanvasStage.tsx`, so an unknown token renders as no
        color at all. Assign round-robin from the four tokens below by the count of
        participants already in the session.
      enum: [amberdeep, warm, remote, live]
      example: amberdeep

    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          example: user_owner
        email:
          type: string
          format: email
          example: jordan@linewarmer.io
        displayName:
          type: string
          description: Derived from the email local part when unset at sign-up.
          example: Jordan Reyes
        createdAt:
          type: string
          format: date-time

    InterviewSession:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerUserId
        - title
        - prompt
        - state
        - candidateEditingEnabled
        - cursorsVisible
        - scheduledAt
        - startedAt
        - endedAt
        - createdAt
        - updatedAt
      description: |
        Every field is required in the response — nullable fields are present with a
        `null` value, never omitted. The client's TypeScript declares them as
        `T | null`, so an absent key becomes `undefined` and breaks strict checks.
      properties:
        id:
          type: string
          example: ses_ratelimiter
        ownerUserId:
          type: string
          description: Assigned server-side at creation; never client-supplied.
          example: user_owner
        title:
          type: string
          maxLength: 200
          example: Design a global rate limiter
        prompt:
          type: string
          description: |
            The problem statement, shown in the room's right-hand panel. Empty
            string when unset — never `null`.
          maxLength: 10000
        state:
          $ref: "#/components/schemas/SessionState"
        candidateEditingEnabled:
          type: boolean
          description: |
            The owner's editing lock. Combined with `state` and the viewer's role to
            compute `canEdit`; a candidate can edit only while this is `true`.
            Forced to `false` when the session ends.
        cursorsVisible:
          type: boolean
          description: |
            Whether remote cursors render. Presentation only — the server still
            broadcasts presence when this is `false`, and the client hides it.
        scheduledAt:
          type: [string, "null"]
          format: date-time
          description: Planned start. Shown on the dashboard; does not change `state`.
        startedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Set on the first `start` only. The top bar's elapsed timer reads it, so
            re-starting must not reset it.
        endedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: |
            Bumped on every mutation. `GET /v1/sessions` sorts on it descending, so
            it must be monotonic per session.

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [title, prompt]
      properties:
        title:
          type: string
          maxLength: 200
          description: |
            Trimmed. Falls back to `"Untitled interview"` when empty after
            trimming — the create form permits an empty title.
        prompt:
          type: string
          maxLength: 10000
          description: Trimmed. May be an empty string.
        scheduledAt:
          type: [string, "null"]
          format: date-time
          description: Optional; the client omits it or sends `null`.
      example:
        title: Design a global rate limiter
        prompt: Design a distributed rate limiter that enforces per-key quotas at 100k req/s.
        scheduledAt: null

    UpdateSessionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Partial update. Exactly the five fields the client patches — `state` is not
        among them, because lifecycle changes go through the `start`, `end`, and
        `archive` endpoints.
      properties:
        title:
          type: string
          maxLength: 200
        prompt:
          type: string
          maxLength: 10000
        candidateEditingEnabled:
          type: boolean
        cursorsVisible:
          type: boolean
        scheduledAt:
          type: [string, "null"]
          format: date-time
      example:
        candidateEditingEnabled: false

    GuestLink:
      type: object
      additionalProperties: false
      required:
        - id
        - sessionId
        - token
        - roleGranted
        - expiresAt
        - maxUses
        - uses
        - revokedAt
        - createdAt
      properties:
        id:
          type: string
          example: lnk_seed
        sessionId:
          type: string
          example: ses_ratelimiter
        token:
          type: string
          description: |
            The plaintext bearer token; the client appends it to its own origin as
            `/join/{token}`. At least 128 bits of entropy, hex-encoded. Stored only
            as a hash per `_docs/spec.md` §11 — see the note on `GET
            /v1/sessions/{sessionId}/guest-links` about what that means for re-reads.
          example: 9f2c1ab7d4e08356bb17c0a4e93f5d21
        roleGranted:
          $ref: "#/components/schemas/GuestRole"
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: "`null` means no expiry. New links default to `null`."
        maxUses:
          type: [integer, "null"]
          minimum: 1
          description: |
            Concurrency cap, checked against active participants at join time —
            not a lifetime redemption count. `null` means uncapped. New links
            default to `10`, matching the per-session participant target in
            `_docs/spec.md` §14.
          example: 10
        uses:
          type: integer
          minimum: 0
          description: Total redemptions, incremented on every successful join.
        revokedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Set on revoke or rotate. Revoked links are excluded from
            `GET .../guest-links`.
        createdAt:
          type: string
          format: date-time

    Participant:
      type: object
      additionalProperties: false
      required: [id, sessionId, userId, displayName, role, color, joinedAt, leftAt]
      properties:
        id:
          type: string
          example: pt_owner
        sessionId:
          type: string
          example: ses_ratelimiter
        userId:
          type: [string, "null"]
          description: "`null` for guests who joined by token."
        displayName:
          type: string
          maxLength: 40
          description: |
            Guest-supplied for token joins, from the user profile otherwise.
            Sanitize before HTML rendering or export.
        role:
          $ref: "#/components/schemas/Role"
        color:
          $ref: "#/components/schemas/ParticipantColor"
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: [string, "null"]
          format: date-time
          description: |
            Soft-delete marker. Set on removal or departure; rows are kept for the
            audit trail. Participants with a non-null `leftAt` are excluded from
            `GET .../participants` and rejected by the room socket.

    JoinResult:
      type: object
      additionalProperties: false
      required: [session, participant]
      description: |
        Returned by both join endpoints. One round trip gives the client everything
        the room screen needs before it opens the socket: the session for the
        permission checks and the participant for `participantId` and `role`.
      properties:
        session:
          $ref: "#/components/schemas/InterviewSession"
        participant:
          $ref: "#/components/schemas/Participant"

    # ------------------------------------------------------------- canvas ---

    ElementKind:
      type: string
      enum: [node, sticky, text, stroke, connector]

    BaseElementFields:
      type: object
      required: [id, kind, createdBy, updatedAt]
      properties:
        id:
          type: string
          description: |
            Client-generated and stable for the element's lifetime. `upsert` keys on
            it, so the server must accept IDs it has not seen before.
          example: el_gateway
        kind:
          $ref: "#/components/schemas/ElementKind"
        createdBy:
          type: string
          description: The `Participant.id` that created the element.
          example: pt_owner
        updatedAt:
          type: integer
          format: int64
          description: |
            **Epoch milliseconds, not an ISO string** — unlike every other
            `updatedAt` in this document. It is the conflict-resolution clock, so it
            must stay a comparable number.

            The merge rule in `frontend/src/canvas/document.ts` is last-write-wins
            per element, ties broken by comparing element IDs (`>=` favours the
            incoming element). The server must apply the identical rule when
            materialising state, or a client's optimistic view will drift from the
            snapshot it gets on reconnect.

            Client-supplied, so it is subject to client clock skew. If you replace it
            with a server-assigned Lamport counter, `useRoom`'s optimistic path has
            to change too — its local apply runs before the server sees the
            operation.
          example: 1754236800000

    NodeElement:
      description: An architecture component from the palette (`_docs/spec.md` §6.4).
      allOf:
        - $ref: "#/components/schemas/BaseElementFields"
        - type: object
          additionalProperties: false
          required: [id, kind, createdBy, updatedAt, componentType, label, description, x, y, width, height]
          properties:
            kind:
              const: node
            componentType:
              type: string
              description: |
                Stable palette type from `frontend/src/canvas/palette.ts` —
                `service`, `rounded`, `boundary`, `generic`, `relational-db`,
                `nosql-db`, `cache`, `object-store`, `warehouse`, `queue`, `stream`,
                `pubsub`, `client`, `browser-client`, `api-gateway`,
                `load-balancer`, `cdn`, `external-api`, `server`, `worker`,
                `function`, `cluster`, `llm`, `embedding`, `vector-db`, `agent`.

                Validate as an opaque non-empty string rather than an enum: the
                palette is client-side data and gains entries without a backend
                deploy. The client falls back to a generic shape for unknown types.
              example: api-gateway
            label:
              type: string
              maxLength: 200
            description:
              type: string
              maxLength: 500
            x:
              type: number
            y:
              type: number
            width:
              type: number
              exclusiveMinimum: 0
            height:
              type: number
              exclusiveMinimum: 0

    StickyElement:
      description: A sticky note.
      allOf:
        - $ref: "#/components/schemas/BaseElementFields"
        - type: object
          additionalProperties: false
          required: [id, kind, createdBy, updatedAt, text, x, y, width, height]
          properties:
            kind:
              const: sticky
            text:
              type: string
              maxLength: 2000
            x:
              type: number
            y:
              type: number
            width:
              type: number
              exclusiveMinimum: 0
            height:
              type: number
              exclusiveMinimum: 0

    TextElement:
      description: A standalone text label. Has no stored width or height.
      allOf:
        - $ref: "#/components/schemas/BaseElementFields"
        - type: object
          additionalProperties: false
          required: [id, kind, createdBy, updatedAt, text, x, y]
          properties:
            kind:
              const: text
            text:
              type: string
              maxLength: 2000
            x:
              type: number
            y:
              type: number

    StrokeElement:
      description: A freehand pen or highlighter stroke, stored as a vector path.
      allOf:
        - $ref: "#/components/schemas/BaseElementFields"
        - type: object
          additionalProperties: false
          required: [id, kind, createdBy, updatedAt, points, color, width, highlighter]
          properties:
            kind:
              const: stroke
            points:
              type: array
              description: |
                Flat `[x0, y0, x1, y1, …]` — even length, not an array of pairs.
                The largest payload the socket carries; cap the length server-side
                (`_docs/spec.md` §13) around the 10,000-point document target in §14.
              items:
                type: number
              example: [120, 200, 128, 214, 140, 232]
            color:
              type: string
              description: A design-token name, resolved client-side. Not a CSS color.
              enum: [ink, amber, remote, warm]
            width:
              type: number
              exclusiveMinimum: 0
            highlighter:
              type: boolean
              description: Renders semi-transparent and behind other elements.

    ConnectorElement:
      description: |
        A directed edge between two elements (`_docs/spec.md` §6.5).
      allOf:
        - $ref: "#/components/schemas/BaseElementFields"
        - type: object
          additionalProperties: false
          required: [id, kind, createdBy, updatedAt, fromId, toId, label, style, dashed, arrowEnd]
          properties:
            kind:
              const: connector
            fromId:
              type: string
              description: |
                Source element ID. Do **not** enforce referential integrity at write
                time: a connector can legitimately arrive before its endpoints when
                operations are reordered.
            toId:
              type: string
              description: Target element ID. Same reordering caveat as `fromId`.
            label:
              type: string
              maxLength: 200
              description: 'Empty string when unlabelled, e.g. `"HTTPS"`, `"read"`.'
            style:
              type: string
              enum: [straight, elbow, curved]
            dashed:
              type: boolean
            arrowEnd:
              type: boolean
              description: |
                Arrowhead at the target end. The MVP client has no separate
                `arrowStart`, so connectors are directed or undirected only.

    CanvasElement:
      description: |
        Discriminated union on `kind`. Reject unknown `kind` values — the client's
        renderer and its `applyOp` reducer both switch exhaustively.
      oneOf:
        - $ref: "#/components/schemas/NodeElement"
        - $ref: "#/components/schemas/StickyElement"
        - $ref: "#/components/schemas/TextElement"
        - $ref: "#/components/schemas/StrokeElement"
        - $ref: "#/components/schemas/ConnectorElement"
      discriminator:
        propertyName: kind
        mapping:
          node: "#/components/schemas/NodeElement"
          sticky: "#/components/schemas/StickyElement"
          text: "#/components/schemas/TextElement"
          stroke: "#/components/schemas/StrokeElement"
          connector: "#/components/schemas/ConnectorElement"

    UpsertOp:
      type: object
      additionalProperties: false
      required: [type, element]
      description: |
        Create or replace an element by ID. Whole-element replacement, not a field
        patch — the client always sends the complete element.
      properties:
        type:
          const: upsert
        element:
          $ref: "#/components/schemas/CanvasElement"

    DeleteOp:
      type: object
      additionalProperties: false
      required: [type, id]
      description: |
        Delete one element **and cascade to its connectors**: every connector whose
        `fromId` or `toId` equals `id` is removed at the same time. The client does
        this locally in `applyOp`, so a server that does not cascade will resurrect
        dangling connectors on the next snapshot.

        Idempotent — deleting an absent ID is a no-op, not an error.
      properties:
        type:
          const: delete
        id:
          type: string

    ClearOp:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        Remove every element. Owner-only; also the operation
        `POST /v1/sessions/{sessionId}/canvas/clear` appends. Keep the prior state
        recoverable from the operation log (`_docs/spec.md` §6.9).
      properties:
        type:
          const: clear

    CanvasOp:
      description: One canvas mutation. Discriminated union on `type`.
      oneOf:
        - $ref: "#/components/schemas/UpsertOp"
        - $ref: "#/components/schemas/DeleteOp"
        - $ref: "#/components/schemas/ClearOp"
      discriminator:
        propertyName: type
        mapping:
          upsert: "#/components/schemas/UpsertOp"
          delete: "#/components/schemas/DeleteOp"
          clear: "#/components/schemas/ClearOp"

    CanvasOperationEnvelope:
      type: object
      additionalProperties: false
      required: [id, clientOperationId, actorId, op, serverReceivedAt, cursor]
      description: |
        A committed operation as broadcast to the room. Everything outside `op` is
        server-assigned.
      properties:
        id:
          type: string
          description: Server-assigned operation ID.
          example: op_1a2b3c
        clientOperationId:
          type: string
          description: |
            The client's idempotency key, used to drop duplicates when an operation
            is retried across a reconnect.

            **Gap to close.** The mock generates this server-side, which makes it
            useless for dedup, and `RoomHandle.sendOps` currently sends bare
            `CanvasOp[]` with no key. Have the client generate one op ID per
            operation and echo it here; until it does, dedup across reconnects
            cannot work, and `_docs/spec.md` §6.7's duplicate tolerance is unmet.
        actorId:
          type: string
          description: |
            The `Participant.id` the server attributed the operation to — derived
            from the socket's credential, never from the client payload.
        op:
          $ref: "#/components/schemas/CanvasOp"
        serverReceivedAt:
          type: integer
          format: int64
          description: Server receipt time, epoch milliseconds.
        cursor:
          type: integer
          minimum: 1
          description: |
            Monotonic per-session position in the operation log, starting at 1. A
            snapshot at cursor *N* plus every operation with `cursor > N` must
            reconstruct current state exactly.

    CanvasSnapshot:
      type: object
      additionalProperties: false
      required: [sessionId, cursor, elements, updatedAt]
      properties:
        sessionId:
          type: string
        cursor:
          type: integer
          minimum: 0
          description: |
            The operation-log position these elements reflect. `0` for a canvas that
            has never been written.
        elements:
          type: array
          description: |
            Materialised state — the result of folding the log, not the log itself.
            Order is not significant to the client; it keys on `id`.
          items:
            $ref: "#/components/schemas/CanvasElement"
        updatedAt:
          type: string
          format: date-time
          description: |
            ISO 8601, unlike `CanvasElement.updatedAt`, which is epoch milliseconds.

    # ---------------------------------------------------- presence & socket ---

    PresenceState:
      type: object
      additionalProperties: false
      required: [participantId, displayName, role, color, cursor, selection, online]
      description: |
        Ephemeral per-participant state. Not persisted (`_docs/spec.md` §6.7) —
        rebuild it from live connections after a gateway restart.
      properties:
        participantId:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        color:
          $ref: "#/components/schemas/ParticipantColor"
        cursor:
          type: [object, "null"]
          additionalProperties: false
          required: [x, y]
          description: |
            Canvas coordinates, not screen coordinates. `null` when the pointer has
            left the canvas. Viewport is personal and never synchronized.
          properties:
            x:
              type: number
            y:
              type: number
        selection:
          type: array
          description: Element IDs the participant currently has selected.
          items:
            type: string
        online:
          type: boolean

    ClientMessage:
      description: |
        Client → server socket frames. Discriminated union on `type`. Sent by
        `RoomHandle` in `frontend/src/services/api.ts`.
      oneOf:
        - $ref: "#/components/schemas/ClientJoinRoom"
        - $ref: "#/components/schemas/ClientDocumentUpdate"
        - $ref: "#/components/schemas/ClientPresenceUpdate"
        - $ref: "#/components/schemas/ClientPing"
      discriminator:
        propertyName: type
        mapping:
          join_room: "#/components/schemas/ClientJoinRoom"
          document_update: "#/components/schemas/ClientDocumentUpdate"
          presence_update: "#/components/schemas/ClientPresenceUpdate"
          ping: "#/components/schemas/ClientPing"

    ClientJoinRoom:
      type: object
      additionalProperties: false
      required: [type, sessionId, participantId]
      description: |
        First frame after the socket opens. Redundant with the query string, and
        redundant with the cookie for authorization — accept it but re-verify.
        The server answers with `room_joined`.
      properties:
        type:
          const: join_room
        sessionId:
          type: string
        participantId:
          type: string

    ClientDocumentUpdate:
      type: object
      additionalProperties: false
      required: [type, ops]
      description: |
        Sent by `RoomHandle.sendOps(ops)`. The client has already applied these
        optimistically, so rejection has to be corrected explicitly — see the
        `editing_locked` sequence in `x-websocket-protocol`.

        On accept: assign a `cursor` per operation, wrap each in a
        `CanvasOperationEnvelope`, persist, and fan out a `document_update` to the
        whole room **including the sender** — the sender's `useRoom` folds its own
        echoed operations again, which is safe because `applyOp` is idempotent for
        an unchanged `updatedAt`.

        Validate size, element count, and text length per `_docs/spec.md` §13, and
        rate-limit. A batch usually holds 1–2 operations; a freehand stroke or a
        multi-select drag can push it higher.
      properties:
        type:
          const: document_update
        ops:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CanvasOp"

    ClientPresenceUpdate:
      type: object
      additionalProperties: false
      required: [type]
      minProperties: 2
      description: |
        Sent by `RoomHandle.updatePresence(patch)` with `cursor`, `selection`, or
        both. A partial patch — merge into the participant's presence and leave
        unmentioned fields alone.

        High frequency: cursor moves fire on pointer motion. Throttle fan-out
        (~20–30 Hz), never persist, and drop rather than queue when a client is
        behind — stale cursors are worse than absent ones.
      properties:
        type:
          const: presence_update
        cursor:
          type: [object, "null"]
          additionalProperties: false
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
        selection:
          type: array
          items:
            type: string

    ClientPing:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        Liveness probe from `_docs/spec.md` §12; the server replies `pong`. The
        current client does not send it — `useRoom` infers connection state from the
        `onStatus` callback the transport drives. Support it for transports that need
        an application-level keepalive.
      properties:
        type:
          const: ping

    ServerMessage:
      description: |
        Server → client socket frames, delivered to the `onMessage` callback of
        `InterviewApi.connect`. Discriminated union on `type`. `useRoom` switches
        exhaustively over these six variants and ignores anything else, so adding a
        variant is backwards-compatible; changing one is not.
      oneOf:
        - $ref: "#/components/schemas/ServerRoomJoined"
        - $ref: "#/components/schemas/ServerDocumentUpdate"
        - $ref: "#/components/schemas/ServerPresenceUpdate"
        - $ref: "#/components/schemas/ServerPermissionChanged"
        - $ref: "#/components/schemas/ServerSessionEnded"
        - $ref: "#/components/schemas/ServerError"
      discriminator:
        propertyName: type
        mapping:
          room_joined: "#/components/schemas/ServerRoomJoined"
          document_update: "#/components/schemas/ServerDocumentUpdate"
          presence_update: "#/components/schemas/ServerPresenceUpdate"
          permission_changed: "#/components/schemas/ServerPermissionChanged"
          session_ended: "#/components/schemas/ServerSessionEnded"
          error: "#/components/schemas/ServerError"

    ServerRoomJoined:
      type: object
      additionalProperties: false
      required: [type, snapshot, presence]
      description: |
        Full state sync. `useRoom` **replaces** its element list and presence list
        wholesale on this message and flips `ready` to `true`.

        Sent in three situations, all of which rely on that replace semantics:

        1. Immediately after `join_room`, as the initial snapshot.
        2. After a reconnect, so the client converges without reloading
           (`_docs/spec.md` §6.7).
        3. After the server rejects an operation, to roll back the client's
           optimistic state.

        The snapshot must be consistent: every operation up to `snapshot.cursor` is
        included, and any operation after it arrives as a later `document_update`
        with no gap in `cursor`.
      properties:
        type:
          const: room_joined
        snapshot:
          $ref: "#/components/schemas/CanvasSnapshot"
        presence:
          type: array
          items:
            $ref: "#/components/schemas/PresenceState"

    ServerDocumentUpdate:
      type: object
      additionalProperties: false
      required: [type, ops]
      description: |
        Committed operations fanned out to the room, sender included. The client
        folds them into its element list with the same last-write-wins rule and
        stamps its "saved" indicator.

        `ops` may be empty; the client short-circuits on that, and the mock uses it
        as a no-op signal before a corrective `room_joined`.

        Target fan-out latency is p95 under 250 ms in-region (`_docs/spec.md` §14).
      properties:
        type:
          const: document_update
        ops:
          type: array
          items:
            $ref: "#/components/schemas/CanvasOperationEnvelope"

    ServerPresenceUpdate:
      type: object
      additionalProperties: false
      required: [type, presence]
      description: |
        The **complete** presence list for the room, not a delta — the client
        replaces its list with this array. Omitting a participant is how they
        disappear, which is what makes disconnect and removal propagate.

        Broadcast on join, on cursor or selection change, on disconnect, and after
        `DELETE .../participants/{participantId}`.
      properties:
        type:
          const: presence_update
        presence:
          type: array
          items:
            $ref: "#/components/schemas/PresenceState"

    ServerPermissionChanged:
      type: object
      additionalProperties: false
      required: [type, session]
      description: |
        The session changed in a way that may alter what a participant can do.
        Carries the whole updated session; the client replaces its copy and
        recomputes `canEdit`.

        Emit after `PATCH /v1/sessions/{id}` and `POST /v1/sessions/{id}/start`.
        Every participant, including the actor, learns of the change this way.
      properties:
        type:
          const: permission_changed
        session:
          $ref: "#/components/schemas/InterviewSession"

    ServerSessionEnded:
      type: object
      additionalProperties: false
      required: [type, session]
      description: |
        The session ended. Emitted after `POST /v1/sessions/{id}/end`, carrying the
        session with `state: "ended"` and `candidateEditingEnabled: false`.

        Distinct from `permission_changed` so the client can show its ended-session
        banner rather than a silent permission flip. Reject every subsequent
        `document_update` on the room after sending this.
      properties:
        type:
          const: session_ended
        session:
          $ref: "#/components/schemas/InterviewSession"

    ServerError:
      type: object
      additionalProperties: false
      required: [type, code, message]
      description: |
        A non-fatal, per-message error. `useRoom` shows `message` in a banner for
        four seconds and keeps the socket open, so use this for recoverable
        conditions and close the socket for fatal ones.
      properties:
        type:
          const: error
        code:
          type: string
          description: |
            Same vocabulary as `Error.code`. Socket-specific values in use:
            `editing_locked` (edit attempted without permission) and `forbidden`
            (not a participant of this session).
        message:
          type: string
          description: User-facing text, displayed verbatim.

x-websocket-protocol:
  summary: |
    The room socket, which OpenAPI cannot express directly. Endpoint:
    `GET /v1/sessions/{sessionId}/realtime?participantId={id}`, upgraded to a
    WebSocket. Frames are JSON text, one message per frame, discriminated on `type`.
  clientToServer:
    schema: "#/components/schemas/ClientMessage"
    messages: [join_room, document_update, presence_update, ping]
  serverToClient:
    schema: "#/components/schemas/ServerMessage"
    messages:
      - room_joined
      - document_update
      - presence_update
      - permission_changed
      - session_ended
      - error
  connectionStatus: |
    `InterviewApi.connect` takes an `onStatus` callback driven with
    `"connected" | "reconnecting" | "offline"`. These are transport states the
    client derives from the socket itself, not server messages:

    - `connected` — socket open and `room_joined` received.
    - `reconnecting` — socket dropped, retry in progress. The client keeps its last
      known canvas and waits for a fresh `room_joined`.
    - `offline` — connection refused or authorization failed; no retry.

    `RoomHandle.simulateNetworkDrop(ms)` is a client-side test affordance used by
    the room screen's "Simulate drop" control. It has no server counterpart; the
    real transport must produce the same sequence naturally
    (`reconnecting` → `connected` → `room_joined`).
  editPermissionRule: |
    Re-evaluate on **every** `document_update`; joining the room is not
    authorization (`_docs/spec.md` §12). An operation is permitted when all hold:

    1. `session.state` is neither `ended` nor `archived`.
    2. The participant's role is not `observer`.
    3. If the role is `candidate`, `session.candidateEditingEnabled` is `true`.
    4. `op.type === "clear"` additionally requires the `owner` role.

    Rules 1–3 mirror the client's `canEdit` in `frontend/src/features/room/useRoom.ts`
    exactly. Keep them identical: divergence shows up as controls that look enabled
    but silently fail, or edits that vanish on the next snapshot.
  rejectionSequence: |
    The client applies edits optimistically, so a rejection must both explain and
    correct. Send three messages in this order, as the mock does:

    1. `error` with code `editing_locked` — surfaces the banner.
    2. `document_update` with `ops: []` — a no-op the client short-circuits.
    3. `room_joined` with the authoritative snapshot — rolls the client back.

    Step 3 is what enforces `_docs/spec.md` §6.8: never silently discard server
    state, and never let an unauthorized local edit survive on screen.
  ordering: |
    - Per connection, deliver frames in order; `cursor` values a client sees must be
      strictly increasing across `document_update` messages.
    - Tolerate duplicate and out-of-order client operations (`_docs/spec.md` §6.7).
      Dedup on `clientOperationId` — see the gap noted on
      `CanvasOperationEnvelope.clientOperationId`.
    - Element-level conflicts resolve last-write-wins on
      `CanvasElement.updatedAt`, ties broken by element ID, matching
      `applyOp` in `frontend/src/canvas/document.ts`.
  persistence: |
    - Durably store operations at least every 2 seconds during active editing
      (`_docs/spec.md` §6.8). The client's "saved" indicator is set on every
      `document_update` it receives, so an operation the client sees fanned out must
      already be durable — do not fan out before the write commits.
    - Compact into periodic snapshots so `room_joined` never replays an unbounded
      log.
    - Presence is never persisted.

x-implementation-notes:
  clientCoverage: |
    Every method on `InterviewApi` maps to exactly one operation here:

    | Client method | Operation |
    | --- | --- |
    | `getCurrentUser` | `GET /v1/auth/me` |
    | `signIn` | `POST /v1/auth/sign-in` |
    | `signOut` | `POST /v1/auth/sign-out` |
    | `listSessions` | `GET /v1/sessions` |
    | `getSession` | `GET /v1/sessions/{sessionId}` |
    | `createSession` | `POST /v1/sessions` |
    | `updateSession` | `PATCH /v1/sessions/{sessionId}` |
    | `startSession` | `POST /v1/sessions/{sessionId}/start` |
    | `endSession` | `POST /v1/sessions/{sessionId}/end` |
    | `archiveSession` | `POST /v1/sessions/{sessionId}/archive` |
    | `duplicateSession` | `POST /v1/sessions/{sessionId}/duplicate` |
    | `listGuestLinks` | `GET /v1/sessions/{sessionId}/guest-links` |
    | `createGuestLink` | `POST /v1/sessions/{sessionId}/guest-links` |
    | `revokeGuestLink` | `DELETE /v1/sessions/{sessionId}/guest-links/{linkId}` |
    | `listParticipants` | `GET /v1/sessions/{sessionId}/participants` |
    | `joinWithToken` | `POST /v1/join/{token}` |
    | `joinAsOwner` | `POST /v1/sessions/{sessionId}/join` |
    | `removeParticipant` | `DELETE /v1/sessions/{sessionId}/participants/{participantId}` |
    | `getCanvas` | `GET /v1/sessions/{sessionId}/canvas` |
    | `clearCanvas` | `POST /v1/sessions/{sessionId}/canvas/clear` |
    | `connect` | `GET /v1/sessions/{sessionId}/realtime` (WebSocket) |
  authMatrix: |
    | Operation | Credential | Additional check |
    | --- | --- | --- |
    | `POST /v1/auth/sign-in` | none | rate limit |
    | `POST /v1/join/{token}` | none (path token) | rate limit |
    | `GET /v1/auth/me` | optional `lw_session` | `401` → client reads `null` |
    | `POST /v1/auth/sign-out` | optional | idempotent |
    | `GET /v1/sessions/{id}` | `lw_session` or `lw_guest` | participant of this session |
    | `GET /v1/sessions/{id}/participants` | `lw_session` or `lw_guest` | participant of this session |
    | `GET /v1/sessions/{id}/canvas` | `lw_session` or `lw_guest` | participant of this session |
    | `GET /v1/sessions/{id}/realtime` | `lw_session` or `lw_guest` | must match `participantId`; re-checked per frame |
    | `GET /v1/sessions` | `lw_session` | owner scope |
    | `POST /v1/sessions` | `lw_session` | rate limit |
    | `POST /v1/sessions/{id}/join` | `lw_session` | membership required for non-owners |
    | `PATCH /v1/sessions/{id}` | `lw_session` | **owner only** |
    | `POST /v1/sessions/{id}/start` | `lw_session` | **owner only** |
    | `POST /v1/sessions/{id}/end` | `lw_session` | **owner only** |
    | `POST /v1/sessions/{id}/archive` | `lw_session` | **owner only** |
    | `POST /v1/sessions/{id}/duplicate` | `lw_session` | **owner only** |
    | `GET /v1/sessions/{id}/guest-links` | `lw_session` | **owner only** |
    | `POST /v1/sessions/{id}/guest-links` | `lw_session` | **owner only** |
    | `DELETE /v1/sessions/{id}/guest-links/{linkId}` | `lw_session` | **owner only** |
    | `DELETE /v1/sessions/{id}/participants/{pid}` | `lw_session` | **owner only** |
    | `POST /v1/sessions/{id}/canvas/clear` | `lw_session` | **owner only** |
  auditEvents: |
    `_docs/spec.md` §13 requires audit records; the mock writes them with these
    `kind` values. The frontend has no endpoint for reading them — add one only when
    a UI needs it.

    `session.created`, `session.started`, `session.ended`, `session.archived`,
    `link.rotated`, `link.revoked`, `participant.joined`, `participant.removed`.

    An `AuditEvent` is `{ id, sessionId, actorId, kind, at }`
    (`frontend/src/services/types.ts`). Permission changes from
    `PATCH /v1/sessions/{id}` are required by §13 but not yet emitted by the mock —
    add a `session.permissions_changed` kind.
  openQuestions: |
    Decisions the backend needs before implementation, beyond
    `_docs/spec.md` §18:

    1. **Sign-in.** `POST /v1/auth/sign-in` returns a `User` in one round trip,
       which is not authentication. Magic-link or IdP flow needed before production.
    2. **`joinAsOwner` authorization.** Currently grants `interviewer` to any
       authenticated user for any session ID. Requires a membership check to meet
       acceptance criterion §16.10.
    3. **Guest-link token re-read.** `GET .../guest-links` returns plaintext tokens,
       which conflicts with hash-only storage in §11.
    4. **`clientOperationId`.** Client-generated keys are needed for the duplicate
       tolerance §6.7 requires; the client does not send them yet.
    5. **Reopening an ended session.** `POST /v1/sessions/{id}/start` on an `ended`
       session — allowed, or `409`? Open in §18.2.
    6. **Prompt gating.** Whether `GET /v1/sessions/{id}` returns `prompt` to a
       candidate before the session starts. Open in §18.1.
