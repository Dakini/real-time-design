global:
  scrape_interval: 15s

scrape_configs:
  # The collector's `prometheus` exporter (app metrics relayed from OTLP).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internal health/throughput metrics.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
