services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: observability-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # The app points OTEL_EXPORTER_OTLP_ENDPOINT at whichever of these it
      # can reach - http://<host>:4318 for the HTTP/protobuf exporter this
      # repo's backend uses (see backend/app/telemetry.py).
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: observability-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: observability-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: observability-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API, published for ad-hoc debugging only -
                     # Grafana reaches it over the compose network instead.
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: observability-grafana
    environment:
      # No auth stood up for this internal dashboard yet; anonymous Viewer
      # access is the trade-off until it's put behind something (see infra
      # weak points in mermain.md).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
